services:
  scenario.generator-web:
    image: ${SCENARIO_GENERATOR_IMAGE:-local/scenario-generator:latest}
    working_dir: /app
    command: python -m scenario_generator.webapp.server
    environment:
      HOME: /tmp/scenario.generator
      SCENARIO_GENERATOR_MAX_UPLOAD_BYTES: ${SCENARIO_GENERATOR_MAX_UPLOAD_BYTES:-104857600}
      SCENARIO_GENERATOR_MAX_STRUCTURED_UPLOAD_BYTES: ${SCENARIO_GENERATOR_MAX_STRUCTURED_UPLOAD_BYTES:-20971520}
      SCENARIO_GENERATOR_SECURE_COOKIES: ${SCENARIO_GENERATOR_SECURE_COOKIES:-auto}
      SCENARIO_GENERATOR_SESSION_COOKIE_PATH: ${SCENARIO_GENERATOR_SESSION_COOKIE_PATH:-/}
      SCENARIO_GENERATOR_SESSION_CLEANUP_INTERVAL_SECONDS: ${SCENARIO_GENERATOR_SESSION_CLEANUP_INTERVAL_SECONDS:-300}
      SCENARIO_GENERATOR_SESSION_TTL_SECONDS: ${SCENARIO_GENERATOR_SESSION_TTL_SECONDS:-86400}
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    cpus: ${SCENARIO_GENERATOR_CPU_LIMIT:-2.0}
    mem_limit: ${SCENARIO_GENERATOR_MEMORY_LIMIT:-2g}
    pids_limit: ${SCENARIO_GENERATOR_PIDS_LIMIT:-256}
    tty: true
    stdin_open: true
